apiVersion: zscaler.com/v1alpha1
kind: GCPInstance
metadata:
  name: example-gcp-instance
  namespace: default
spec:
  parameters:
    gcpProfile:
      project: temp-463509
      region: us-central1
      mgmtSubnet: my-management-subnet
      dnsZoneName: my-dns-zone
      dnsZoneDomain: example.com
    instanceConfig:
      name: my-vm
      machineType: e2-medium
      zone: us-central1-a
      bootDiskType: pd-ssd
      bootSize: 20
      dataSize: 50
      image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2204-lts
      configureNlb: false
      configurePfRule: false
      noOfPfRule: 0
      serviceType: NONE
      zsCloud: global
      interfaces:
        - subnetwork: projects/temp-463509/regions/us-central1/subnetworks/prajna-client-subnet
          nicType: VIRTIO_NET
          aliasIps:
            - 10.0.0.6
      userData: |
        #!/bin/bash
        echo "Hello from VM"
    instanceName: my-vm-fqdn
    sshKeys:
      - username: ubuntu
        sshKey: ubuntu:ssh-rsa  palprajna2002@gmail.com
    subnetNames:
      client: prajna-client-subnet
      server: prajna-server-subnet
      cloud: prajna-cloud-subnet
    tags:
      - prajna-vm
    createDnsRecord: true
  writeConnectionSecretToRef:
    name: gcp-instance-creds
